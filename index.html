<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Poroteo Legislativo: cómo vota la Cámara de Diputados y cómo podría votar un proyecto de ley. Democracia en Red."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Poroteo Legislativo</title>
    <script>
      // Aplica el tema guardado antes de pintar (evita parpadeo).
      try {
        var t = localStorage.getItem('poroteo:tema');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
